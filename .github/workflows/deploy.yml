name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/github_actions_key
          chmod 600 ~/.ssh/github_actions_key

      - name: Add know hosts
        run: |
          ssh-keyscan -p "${{ secrets.VPS_PORT }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Create .env on VPS
        run: |
          ssh -p "${{ secrets.VPS_PORT }}" -i ~/.ssh/github_actions_key "${{ secrets.VPS_USER }}"@"${{ secrets.VPS_HOST }}" << 'EOF'
            cat > /srv/docker/web/portfolio/website/.env << ENVEOF
          NUXT_TARGET_EMAIL=${{ secrets.NUXT_TARGET_EMAIL }}
          NUXT_EMAIL_PASS=${{ secrets.NUXT_EMAIL_PASS }}
          NUXT_PUBLIC_IS_MAINTENANCE=${{ secrets.NUXT_PUBLIC_IS_MAINTENANCE }}
          ENVEOF
            chmod 600 /srv/docker/web/portfolio/website/.env
          EOF

      - name: Deploy
        run: |
          ssh -p "${{ secrets.VPS_PORT }}" -i ~/.ssh/github_actions_key "${{ secrets.VPS_USER }}"@"${{ secrets.VPS_HOST }}" "cd /srv/docker/web/portfolio && git pull && docker compose up -d --build production"